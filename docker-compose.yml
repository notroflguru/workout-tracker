services:
  postgres:
    image: postgres:18.6-alpine
    container_name: workout-tracker
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workout_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - workout_tracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-workout_tracker}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workout_tracker_postgres_data: