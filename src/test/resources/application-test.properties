spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/workout_tracker_test}
spring.datasource.username=${TEST_DATABASE_USERNAME:postgres}
spring.datasource.password=${TEST_DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.orm.jdbc.bind=off

jwt.secret=${JWT_SECRET:test-secret-for-jwt-signing-at-least-32-characters}
jwt.expiration-ms=900000